name: QuantDeus Mission OS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  mission-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run mission cycle
        env:
          MISSION_OS_MODE: mock
          MISSION_OS_STATE_DIR: .state
        run: |
          python -m quantdeus.main --once
