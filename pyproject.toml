[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdeus-mission-os"
version = "0.1.0"
description = "Multi-agent mission control scaffold for research coordination"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Energotron"}]

[project.scripts]
quantdeus = "quantdeus.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
